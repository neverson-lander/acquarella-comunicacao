services:
  whatsapp-qr:
    build:
      context: ..
      dockerfile: whatsapp-qr-gateway/Dockerfile
    env_file: .env
    environment:
      HOST: 0.0.0.0
      QR_DATA_DIR: /app/whatsapp-qr-gateway/data
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - whatsapp-qr-data:/app/whatsapp-qr-gateway/data
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  whatsapp-qr-data:
